# 同步辐射真空阀联锁 · 因果一致性服务与验收
services:
  app:
    build:
      context: .
      target: app
    image: vacuum-interlock-app
    environment:
      LISTEN_ADDR: ":8080"
      # 因果状态持久化目录（容器内路径，提交日志 interlock.wal 存放于此）
      DATA_DIR: /data
      # 验收钩子：允许 verify 经 POST /admin/restart 触发进程级重启
      ENABLE_ADMIN_RESTART: "1"
    volumes:
      # 数据目录可配置（宿主目录绑定挂载）：APP_DATA_DIR=/srv/interlock docker compose up app
      - "${APP_DATA_DIR:-./data}:/data"
    ports:
      # 宿主端口可配置：APP_HOST_PORT=9090 docker compose up app
      - "${APP_HOST_PORT:-8080}:8080"

  # 验收：构建检查 + 代码测试 + 因果场景与崩溃恢复 HTTP 冒烟，执行后退出并以退出码报告结果。
  # 用法：docker compose up --build --exit-code-from verify --abort-on-container-exit
  verify:
    build:
      context: .
      target: verify
    image: vacuum-interlock-verify
    depends_on:
      - app
    environment:
      APP_URL: http://app:8080
      # 与 app 共享同一数据目录：核对落盘时序、模拟崩溃撕裂写入
      DATA_DIR: /data
    volumes:
      - "${APP_DATA_DIR:-./data}:/data"
